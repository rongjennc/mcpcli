[tool.poetry]
name = "mcpcli"
version = "0.1.0"
description = "A terminal-based client for local LLMs and MCP servers."
authors = ["Jules"]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.9.0"
httpx = "^0.25.0" # For async requests to Ollama
pydantic = "^2.0.0" # For config validation

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"

[tool.poetry.scripts]
mcpcli = "mcpcli.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
