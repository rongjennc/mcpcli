[tool.poetry]
name = "mcpcli"
version = "0.1.0"
description = "A terminal-based client for local LLMs and MCP servers."
authors = ["Jules"]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.9.0"
requests = "^2.31.0"
httpx = "^0.25.0" # For async requests to Ollama

[tool.poetry.scripts]
mcpcli = "mcpcli.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
